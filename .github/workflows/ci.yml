name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Test
        run: cargo test --all-targets --verbose

  release-workflow:
    name: Release workflow guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test isolation and generated workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-workflow-venv"
          "$RUNNER_TEMP/release-workflow-venv/bin/pip" install PyYAML
          "$RUNNER_TEMP/release-workflow-venv/bin/python" tests/release_workflow.py
          dir="$(mktemp -d "$RUNNER_TEMP/issuectl-dist-check.XXXXXXXX")"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-x86_64-unknown-linux-gnu.tar.xz \
            -o "$dir/dist.tar.xz"
          echo '4b3f0a5f0ebbdb798f6db649d01b32ba1518376b6f7a0502b7d92b75cc2c8293  '"$dir/dist.tar.xz" | sha256sum --check
          tar -xf "$dir/dist.tar.xz" -C "$dir"
          dist="$dir/cargo-dist-x86_64-unknown-linux-gnu/dist"
          python3 scripts/release_workflow.py --check --dist "$dist"
          # The wrapper runs native generate --check in a pristine disposable
          # workspace; native checking refuses allow-dirty in the live checkout.
          # Exercise the release build's pre-publication CI validation. Global
          # artifacts need no cross-toolchains, release credentials or upload.
          "$dist" build --artifacts=global

  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets
