[package]
name = "issuectl"
version = "0.1.0"
edition = "2021"
description = "CLI for managing markdown-based issues with frontmatter"
license = "MIT"
repository = "https://github.com/jarimustonen/issuectl"

[[bin]]
name = "issuectl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
strip = true
lto = true
