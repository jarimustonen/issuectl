[package]
name = "issuectl"
version = "0.3.1"
edition = "2021"
rust-version = "1.82"
authors = ["Jari Mustonen <jari.mustonen@iki.fi>"]
description = "AI-first CLI for managing markdown-based issues with YAML frontmatter"
license = "MIT"
repository = "https://github.com/jarimustonen/issuectl"
homepage = "https://github.com/jarimustonen/issuectl"
documentation = "https://github.com/jarimustonen/issuectl#readme"
readme = "README.md"
keywords = ["cli", "issues", "markdown", "frontmatter", "claude-code"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "issues/**",
    ".github/**",
    ".workmux.yaml",
    ".claude/**",
    ".codex/**",
]

[[bin]]
name = "issuectl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
ammonia = "4"
notify = "8"
notify-debouncer-full = "0.6"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
tempfile = "3"
rand = "0.8"
similar = { version = "2", default-features = false, features = ["text"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "jarimustonen/homebrew-issuectl"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Allow manual edits to .github/workflows/release.yml (we widened
# permissions to write-all to fix HTTP 403 on release creation —
# cargo-dist's default 'contents: write' was insufficient).
allow-dirty = ["ci"]
