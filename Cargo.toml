[package]
name = "issuectl"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Jari Mustonen <jari.mustonen@iki.fi>"]
description = "AI-first CLI for managing markdown-based issues with YAML frontmatter"
license = "MIT"
repository = "https://github.com/jarimustonen/issuectl"
homepage = "https://github.com/jarimustonen/issuectl"
documentation = "https://github.com/jarimustonen/issuectl#readme"
readme = "README.md"
keywords = ["cli", "issues", "markdown", "frontmatter", "claude-code"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "issues/**",
    ".github/**",
    ".workmux.yaml",
    ".claude/**",
    ".codex/**",
]

[[bin]]
name = "issuectl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
