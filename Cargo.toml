[workspace]
resolver = "2"
members = ["crates/issuectl", "crates/issuectl-core"]

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.82"
authors = ["Jari Mustonen <jari.mustonen@iki.fi>"]
license = "MIT"
repository = "https://github.com/jarimustonen/issuectl"
homepage = "https://github.com/jarimustonen/issuectl"

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "jarimustonen/homebrew-issuectl"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Allow manual edits to .github/workflows/release.yml (we widened
# permissions to write-all to fix HTTP 403 on release creation —
# cargo-dist's default 'contents: write' was insufficient).
allow-dirty = ["ci"]
