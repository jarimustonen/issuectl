[package]
name = "issuectl-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal implementation crate for the `issuectl` binary. Not a stable API."
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "issuectl_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
ammonia = "4"
notify = "8"
notify-debouncer-full = "0.6"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
hex = "0.4"
fs2 = "0.4"
tempfile = "3"
rand = "0.8"
similar = { version = "2", default-features = false, features = ["text"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
filetime = "0.2"
