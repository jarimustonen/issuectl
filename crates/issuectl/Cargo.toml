[package]
name = "issuectl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AI-first CLI for managing markdown-based issues with YAML frontmatter"
documentation = "https://github.com/jarimustonen/issuectl#readme"
readme = "../../README.md"
keywords = ["cli", "issues", "markdown", "frontmatter", "claude-code"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "issues/**",
    ".github/**",
    ".workmux.yaml",
    ".claude/**",
    ".codex/**",
]

[[bin]]
name = "issuectl"
path = "src/main.rs"

[dependencies]
issuectl-core = { path = "../issuectl-core", version = "0.8.1" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
serde_yaml = "0.9"
similar = { version = "2", default-features = false, features = ["text"] }

[dev-dependencies]
tempfile = "3"
